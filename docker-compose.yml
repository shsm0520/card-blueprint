version: "3.8"

services:
  card-blueprint:
    image: ghcr.io/shsm0520/card-blueprint:latest
    container_name: card-blueprint
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: file:/app/data/card_blueprint.db
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    volumes:
      - card-blueprint-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - card-blueprint-network

volumes:
  card-blueprint-data:
    driver: local

networks:
  card-blueprint-network:
    driver: bridge
