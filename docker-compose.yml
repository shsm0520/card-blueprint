version: "3.8"

services:
  card-tree-mvp:
    image: ghcr.io/YOUR_USERNAME/card-tree-mvp:latest
    container_name: card-tree-mvp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: file:/app/data/card_tree.db
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - card-tree-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - card-tree-network

volumes:
  card-tree-data:
    driver: local

networks:
  card-tree-network:
    driver: bridge
