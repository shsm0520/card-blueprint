name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch/minor/major)"
        required: false
        default: "patch"
      version:
        description: "Explicit version (e.g., v1.0.0). Overrides bump."
        required: false
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: semver
        uses: actions/github-script@v7
        with:
          script: |
            const cp = require('child_process');

            function getLastTag() {
              try {
                const out = cp.execSync("git tag --list 'v*'", { encoding: 'utf8' }).trim();
                const tags = out.split(/\n/).filter(Boolean);
                if (tags.length === 0) return null;
                // Sort semver descending
                const toNums = t => t.replace(/^v/, '').split('.').map(n => parseInt(n, 10));
                tags.sort((a,b) => {
                  const A = toNums(a), B = toNums(b);
                  for (let i=0;i<3;i++) {
                    if ((B[i]||0)!==(A[i]||0)) return (B[i]||0)-(A[i]||0);
                  }
                  return 0;
                });
                return tags[0];
              } catch (e) {
                return null;
              }
            }

            function bump(tag, type) {
              if (!tag) tag = 'v0.0.0';
              const [maj, min, pat] = tag.replace(/^v/, '').split('.').map(n => parseInt(n,10)||0);
              if (type === 'major') return `v${maj+1}.0.0`;
              if (type === 'minor') return `v${maj}.${min+1}.0`;
              return `v${maj}.${min}.${pat+1}`; // patch default
            }

            const event = context.eventName;
            let desired = null;
            if (event === 'workflow_dispatch') {
              const version = context.payload?.inputs?.version;
              const bumpInput = (context.payload?.inputs?.bump || 'patch').toLowerCase();
              if (version && /^v\d+\.\d+\.\d+$/.test(version)) {
                desired = version;
              } else {
                desired = bump(getLastTag(), bumpInput);
              }
            } else if (event === 'push' && context.ref && context.ref.startsWith('refs/tags/')) {
              // Tag push: use exact tag
              desired = context.ref.replace('refs/tags/', '');
            } else {
              // Branch push: bump patch by default, or parse commit message markers
              let bumpType = 'patch';
              const msg = context.payload?.head_commit?.message || '';
              if (/\[release:major\]/i.test(msg)) bumpType = 'major';
              else if (/\[release:minor\]/i.test(msg)) bumpType = 'minor';
              desired = bump(getLastTag(), bumpType);
            }

            core.setOutput('version', desired);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semver.outputs.version }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
